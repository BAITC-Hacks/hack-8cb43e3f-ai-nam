name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: OCR (Tesseract rus+kaz)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-kaz fonts-dejavu-core
      - run: pip install -r backend/requirements-dev.txt
      - name: Tests (включая контрольный сценарий из ТЗ)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t orgstruct-ai:ci .
      - name: Smoke test (контейнер отвечает, OCR и PDF доступны, демо-проекты созданы)
        run: |
          docker run -d --name app -p 8000:8000 orgstruct-ai:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/meta | tee meta.json
          python3 -c "import json; m=json.load(open('meta.json')); assert m['ocr'] and m['pdf_export'] and len(m['demo_sets'])==2, m"
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"analyst@example.com","password":"analyst12345"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          for i in $(seq 1 60); do
            N=$(curl -fsS http://127.0.0.1:8000/api/projects -H "Authorization: Bearer $TOKEN" | python3 -c "import sys,json;print(sum(1 for p in json.load(sys.stdin) if (p['last_run'] or {}).get('status')=='done'))")
            [ "$N" = "2" ] && echo "demo analyses done" && break; sleep 3
          done
          [ "$N" = "2" ] || (docker logs app; exit 1)
